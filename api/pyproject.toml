[project]
name = "controle-casa-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Teto na minor: os parsers determinísticos (D-08) são regex sobre a saída
    # de `extract_text()`, e uma mudança de layout de texto quebra a leitura
    # das faturas sem erro nenhum.
    "pdfplumber>=0.11.10,<0.12",
    # Upload de arquivo no FastAPI (`UploadFile`). 0.0.18 corrige o DoS do
    # parser de multipart (CVE-2024-53981).
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "testcontainers[postgres]>=4.8.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

# Só `app` é pacote instalável. Sem isto, a descoberta automática do
# setuptools vê `app`, `alembic`, `scripts` e `tests` lado a lado e recusa o
# build — `pip install -e "api[dev]"` fora do Docker falhava antes de chegar
# nas dependências. No Docker nada muda: o build copia só este arquivo antes
# do `pip install`, e o código entra pelo volume.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    # Nomes de domínio são em português e os textos de erro vão para a UI —
    # acento e "›" em string não são ambiguidade a corrigir.
    "RUF001",
    "RUF002",
    "RUF003",
    # `V` e `VO` são apelidos deliberados das views: as queries de analytics
    # ficam ilegíveis com `vw_transacoes_completa.c.valor` repetido.
    "N812",
    # `PgUUID` distingue o tipo do Postgres do `uuid.UUID` do Python.
    "N811",
    # `ErroDominio` é a base dos erros de domínio; sufixo "Error" em inglês
    # brigaria com o resto do vocabulário do projeto.
    "N818",
    # `Generic[T]` em vez de PEP 695: Pydantic v2 lida melhor com a forma
    # clássica em modelos genéricos.
    "UP046",
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

# `anthropic` é dependência opcional: só entra em jogo com INSIGHTS_BACKEND=api.
# Quem gera o relatório pelo CLI do Claude Code não precisa instalar o pacote,
# então o import é adiado e o mypy não tem stub para resolver.
[[tool.mypy.overrides]]
module = ["anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# `tests_sem_banco` roda sem Docker: `pytest tests_sem_banco`.
testpaths = ["tests", "tests_sem_banco"]
addopts = "-q"
