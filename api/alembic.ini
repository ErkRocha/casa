[alembic]
script_location = alembic
prepend_sys_path = .
# Separador de caminho explícito: sem isso o Alembic cai no modo legado, que
# quebra em caminho com espaço ou dois-pontos (todo caminho do Windows tem).
path_separator = os
version_path_separator = os
# A URL real vem de DATABASE_URL, resolvida em alembic/env.py.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
