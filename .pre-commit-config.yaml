repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(api|compras)/
      - id: ruff-format
        files: ^(api|compras)/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        files: ^api/app/
        additional_dependencies:
          - sqlalchemy[mypy]>=2.0
          - pydantic>=2.9
          - pydantic-settings>=2.6
          - types-python-dateutil

      # Serviço de compras (D-25): mesmo mypy, com a configuração dele.
      - id: mypy
        name: mypy (compras)
        files: ^compras/compras/
        args: [--config-file=compras/pyproject.toml]
        additional_dependencies:
          - sqlalchemy[mypy]>=2.0
          - pydantic>=2.9
          - pydantic-settings>=2.6

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
