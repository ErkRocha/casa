[project]
name = "controle-casa-compras"
version = "0.1.0"
description = "Lista de compras e despensa da casa (D-25)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Fusos no Windows, como na API de finanças.
    "tzdata>=2024.1",
    # Consulta pública da NFC-e e a API de finanças (nota fiscal e preços).
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "testcontainers[postgres]>=4.8.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

# O pacote se chama `compras`, não `app`: no modo local o venv é o mesmo da
# API de finanças, e dois pacotes `app` instalados se sobrescreveriam.
[tool.setuptools.packages.find]
include = ["compras*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    # Nomes de domínio em português e textos que vão para a tela.
    "RUF001",
    "RUF002",
    "RUF003",
    # `ErroDominio` é a base dos erros de domínio, como em finanças.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
# A página de NFC-e inventada para os testes: HTML, linhas longas de propósito.
"tests/nfce_apoio.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
