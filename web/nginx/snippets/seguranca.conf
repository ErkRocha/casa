# Cabeçalhos de segurança do painel (D-19). Incluído no server e de novo em
# cada location que tem `add_header` próprio: no nginx, um `add_header` na
# location descarta os herdados do server.
#
# Sem CSP de script/estilo: o Recharts e o Tailwind usam estilo inline, e
# uma política restritiva quebraria os gráficos. Do CSP fica só o
# frame-ancestors, que não toca no que a página carrega.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
